---
$schema: https://json-schema.org/draft/2020-12/schema
title: CDIF Provenance
description: Building block that defines the prov:wasGeneratedBy property for CDIF
  metadata records. Wraps the cdifProvActivity building block as an array of
  provenance activities that describe how the described resource was generated.
type: object
properties:
  'schema:subjectOf':
    properties:
      'dcterms:conformsTo':
        type: array
        items:
          description: "uri for specifications that this metadata record conforms to"
          $ref: ../../../cdifDataType/objectReference/schema.yaml
        minItems: 1
        contains:
          type: object
          required: ['@id']
          additionalProperties: false
          properties:
            '@id':
              const: 'https://w3id.org/cdif/provenance/1.1'
  'prov:wasGeneratedBy':
    description: Provenance activities describing how the resource was generated,
      including agents, instruments, methodology, temporal bounds, and action chaining.
    type: array
    items:
      $ref: ../../../cdifDataType/cdifProvActivity/schema.yaml
