$schema: https://json-schema.org/draft/2020-12/schema
description: schema to document file-based access to a resoruce via URL, based on schema.org/DataDownload
type: object
properties:
  '@id': 
    type: string
  '@type':
    type: array
    description: implement as array because extensions might need to add additional types
    items:
      type: string
    contains:
      const: schema:DataDownload
    minItems: 1
  'schema:name':
    type: string
  'schema:description':
    type: string
    description: Description of this distribution, e.g. what format, access constraints, etc.
  'schema:contentUrl':
    type: string
    format: uri
  'schema:encodingFormat':
    type: array
    description: MIME type with extension; should indicate the serialization scheme in sufficient detail
        that machine can know how to parse.
    items:
      type: string
  'schema:additionalType':
    type: array
    description: >-
      Domain-specific type classification for this distribution: what KIND of
      thing the file is, beyond its MIME type. schema:encodingFormat says how to
      parse the bytes; this says what they are. A plain string is accepted, but a
      schema:DefinedTerm carrying schema:inDefinedTermSet is preferred where the
      value comes from a controlled vocabulary, so the vocabulary travels with the
      data rather than being asserted only in a profile.
    items:
      $ref: '#/$defs/cdifConceptOrTermOrString'
  'schema:contentSize':
    type: string
    description: File size of this distribution, e.g. '2.5 MB' or a byte count. Per schema.org/contentSize.
  'schema:width':
    type: object
    description: >-
      Pixel width of this distribution when it is a single raster file, as a QuantitativeValue.
      schema:width has schema:MediaObject in its domain. A QuantitativeValue rather than a bare
      number because the same property carries physical dimensions elsewhere, so the unit has to
      be stated. (schema:contentSize above is a plain string for historical reasons; that
      inconsistency is left alone rather than widened.)
    properties:
      '@type':
        type: array
        items:
          type: string
        contains:
          const: 'schema:QuantitativeValue'
        minItems: 1
      'schema:value':
        type: number
        description: Width in pixels.
      'schema:unitText':
        type: string
        description: Unit of measure, e.g. 'pixel'.
  'schema:height':
    type: object
    description: >-
      Pixel height of this distribution when it is a single raster file, as a QuantitativeValue.
      schema:height has schema:MediaObject in its domain. A QuantitativeValue rather than a bare
      number because the same property carries physical dimensions elsewhere, so the unit has to
      be stated. (schema:contentSize above is a plain string for historical reasons; that
      inconsistency is left alone rather than widened.)
    properties:
      '@type':
        type: array
        items:
          type: string
        contains:
          const: 'schema:QuantitativeValue'
        minItems: 1
      'schema:value':
        type: number
        description: Height in pixels.
      'schema:unitText':
        type: string
        description: Unit of measure, e.g. 'pixel'.
  'spdx:checksum':
    type: object
    description: A string value calculated from the content of the resource representation, used to test
      if content has been modified. The checksum is a property of a particular distribution/DataDownload.
    properties:
      '@type':
        type: array
        items:
          type: string
        contains:
          const: 'spdx:Checksum'
        minItems: 1
      'spdx:algorithm':
        type: string
      'spdx:checksumValue':
        type: string
    required:
      - '@type'
      - 'spdx:algorithm'
      - 'spdx:checksumValue'
  'dcterms:conformsTo':
    description: An identifier for a standard or specification that the distribution conforms to.
      Recommended to enable machine-actionable data access.
    type: array
    minItems: 1
    items:
      description: "uri for specification that this distribution conforms to"
      $ref: ../../cdifDataType/objectReference/schema.yaml
  'schema:provider':
    type: array
    description: Party who maintains this particular distribution option for the dataset. Use this property
      if there are multiple distributions from different providers
    items:
      anyOf:
      - description: "a identifier for an agent defined in this metadata, or externally; must be dereferenceable"
        $ref: ../../cdifDataType/objectReference/schema.yaml
      - $ref: ../person/schema.yaml
      - $ref: ../organization/schema.yaml
required:
- '@type'
allOf:
# schema:contentUrl is required for an ordinary download, and is what makes a DataDownload
# useful. It cannot be required of a bundle that is retrieved indirectly: an archive whose
# only route is an API returning a time-limited signed URL, or a landing page, has no href
# that can be published. cdifCore's own prose already allows for that case --
#
#   schema:url  "...If a direct link is available to get the data, put in
#                distribution/contentUrl"
#   distribution "...If user must access data through a landing page, provide link to
#                landing page in the 'url' property for the dataset"
#
# -- but until now the schema had no way to express it. A distribution additionally typed
# schema:Collection is that case, and must instead enumerate its members in schema:hasPart,
# so it stays self-describing rather than simply losing its address. cdifCore carries the
# other half of the rule: a Collection with no contentUrl obliges the dataset to publish a
# landing page in schema:url.
- if:
    not:
      type: object
      required:
      - '@type'
      properties:
        '@type':
          type: array
          contains:
            const: schema:Collection
  then:
    required:
    - 'schema:contentUrl'
  else:
    required:
    - 'schema:hasPart'
$defs:
  cdifConceptOrTermOrString:
    $ref: ../../cdifDataType/cdifConceptOrTermOrString/schema.yaml
