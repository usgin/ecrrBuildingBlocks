---
$schema: https://json-schema.org/draft/2020-12/schema
description: 'The time interval during which data was collected or observations were made; or a time period
  that an activity or collection is linked to intellectually or thematically (for example, 1997 to 1998;
  the 18th century) (see https://documentation.ardc.edu.au/display/DOC/Temporal+coverage). For documentation
  of Earth Science, Paleobiology or Paleontology datasets, we are interested in the second case-- the
  time period that data are linked to thematically. NOTE-- context must include "time": "http://www.w3.org/2006/time#"}'
properties:
  'schema:description':
    type: string
    description: >-
      free text description of the temporal extent. Declared here rather than in
      one interval form so that any object form below may carry it; the plain
      ISO 8601 string form cannot.
anyOf:
- type: object
  description: a w3c time proper interval with bounds that are named time ordinal eras with identifier,
    e.g. geologic age. This is a SOSO schema.org extension
  properties:
    '@type':
      default: ['time:ProperInterval']
      type: array
      items:
        type: string
      contains:
        const: time:ProperInterval
      minItems: 1
    'time:intervalStartedBy':
      type: string
      format: uri
      description: "identifier for a named time ordinal era that is older bound of time interval, e.g.\
        \ 'isc:LowerDevonian' "
    'time:intervalFinishedBy':
      type: string
      format: uri
      description: "identifier for a named time ordinal era that is younger bound of time interval, e.g.\
        \ 'isc:LowerDevonian' "
  anyOf:
  - required:
    - 'time:intervalStartedBy'
  - required:
    - 'time:intervalFinishedBy'
- type: object
  description: a w3c time proper interval with bounds that numeric ages.
  properties:
    '@context':
      type: object
      properties:
        time:
          type: string
          const: http://www.w3.org/2006/time#
        schema:
          type: string
          const: http://schema.org/
      required:
      - time
      - schema
      additionalProperties: true
      description: Must exactly match the specified @context object.
    '@type':
      default: ['time:ProperInterval']
      type: array
      items:
        type: string
      contains:
        const: time:ProperInterval
      minItems: 1
    'time:hasBeginning':
      type: object
      properties:
        '@type':
          type: array
          items:
            type: string
          contains:
            const: time:Instant
          minItems: 1
        'time:inTimePosition':
          $ref: '#/$defs/timePosition_type'
      required:
      - 'time:inTimePosition'
    'time:hasEnd':
      type: object
      properties:
        '@type':
          type: array
          items:
            type: string
          contains:
            const: time:Instant
          minItems: 1
        'time:inTimePosition':
          $ref: '#/$defs/timePosition_type'
      required:
      - 'time:inTimePosition'
  anyOf:
  - required:
    - 'time:hasBeginning'
  - required:
    - 'time:hasEnd'
- type: object
  description: >-
    a w3c time proper interval with calendar date bounds, each a time:Instant
    giving its date as time:inXSDDate (an xsd:date, YYYY-MM-DD). The object form
    of a calendar interval, for when the interval needs a description, which the
    ISO 8601 string form below cannot carry.
  properties:
    '@type':
      default: ['time:ProperInterval']
      type: array
      items:
        type: string
      contains:
        const: time:ProperInterval
      minItems: 1
    'time:hasBeginning':
      $ref: '#/$defs/calendarInstant_type'
    'time:hasEnd':
      $ref: '#/$defs/calendarInstant_type'
  required:
  - '@type'
  anyOf:
  - required:
    - 'time:hasBeginning'
  - required:
    - 'time:hasEnd'
- type: string
  description: Simple ISO8601 encoding of calendar date, dateTime, or time interval with calendar date
    bounds
$defs:
  calendarInstant_type:
    type: object
    properties:
      '@type':
        default: ['time:Instant']
        type: array
        items:
          type: string
        contains:
          const: time:Instant
        minItems: 1
      'time:inXSDDate':
        type: string
        description: the date of the instant, as an xsd:date
        pattern: ^-?\d{4,}-\d{2}-\d{2}(Z|[+-]\d{2}:\d{2})?$
    required:
    - '@type'
    - 'time:inXSDDate'
  timePosition_type:
    type: object
    properties:
      '@type':
        default: ['time:TimePosition']
        type: array
        items:
          type: string
        contains:
          const: time:TimePosition
        minItems: 1
      'time:hasTRS':
        type: string
        description: identifier for a temporal reference system; default is million years before prsent
          as a decimal number
        default: http://www.opengis.net/def/crs/OGC/0/ChronometricGeologicTime
      'time:numericPosition':
        type: number
    required:
    - '@type'
    - 'time:hasTRS'
    - 'time:numericPosition'