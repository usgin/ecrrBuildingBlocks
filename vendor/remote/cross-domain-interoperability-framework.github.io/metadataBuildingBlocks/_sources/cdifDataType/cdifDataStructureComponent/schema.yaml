'$schema': 'https://json-schema.org/draft/2020-12/schema'
title: DDI-CDI Data Structure Component
description: >-
  Role given to a represented variable in the context of a long or wide data structure to
  identify the units associated to data points, and in dimensional and key value data structures
  to provide identifying fields for the instance values.
anyOf:
- '$ref': '#/$defs/IdentifierComponent'
- '$ref': '#/$defs/MeasureComponent'
- '$ref': '#/$defs/AttributeComponent'
- '$ref': '#/$defs/DimensionComponent'
- '$ref': '#/$defs/VariableValueComponent'
- '$ref': '#/$defs/VariableDescriptorComponent'
# cdif:isDefinedBy_Variable (on every component below) was renamed from
# cdif:isDefinedBy_RepresentedVariable, whose name implied only the superclass was
# allowed. In DDI-CDI an InstanceVariable IS a RepresentedVariable (subclass), so an
# InstanceVariable satisfies the property -- but JSON Schema has no inheritance and
# cannot infer it, so both branches are listed explicitly in each anyOf.
#
# The same-named property on cdifInstanceVariable is NOT renamed: there it means
# something narrower -- the RepresentedVariable that an InstanceVariable instantiates --
# and that link is reference-only, with a conditional rule suppressing duplicated
# represented-variable-level properties. The two are now distinguishable by name.
'$defs':
  cdifConceptOrTermOrString:
    $ref: ../cdifConceptOrTermOrString/schema.yaml
  cdifConceptOrTerm:
    $ref: ../cdifConceptOrTerm/schema.yaml
  IdentifierComponent:
    type: object
    description: >-
      Role given to a represented variable in the context of a long or wide data structure
      to identify the units associated to data points, and in dimensional and key value data
      structures to provide identifying fields for the instance values.
    properties:
      '@type':
        type: array
        items:
          type: string
        contains:
          const: 'cdi:IdentifierComponent'
        minItems: 1
      '@id':
        type: string
        description: Identifier for this IdentifierComponent node
      'cdif:isDefinedBy_Variable':
        description: >-
          The variable this component is a role of -- a RepresentedVariable or an
          InstanceVariable, inline or by @id reference. See the note above $defs.
        anyOf:
        - '$ref': ../../cdifDataType/cdifRepresentedVariable/schema.yaml
        - '$ref': ../../cdifDataType/cdifInstanceVariable/schema.yaml
        - '$ref': '../objectReference/schema.yaml'
    required:
    - '@type'
    - 'cdif:isDefinedBy_Variable'
  MeasureComponent:
    type: object
    description: >-
      Role given to a represented variable in the context of a data structure to hold the
      observed/derived values.
    properties:
      '@type':
        type: array
        items:
          type: string
        contains:
          const: 'cdi:MeasureComponent'
        minItems: 1
      '@id':
        type: string
        description: Identifier for this MeasureComponent node
      'cdif:name':
        anyOf:
        - type: string
        - type: array
          items:
            type: string
          minItems: 1
        description: >-
          Human understandable name (linguistic signifier, word, phrase, or mnemonic). May
          follow ISO/IEC 11179-5 naming principles, and have context provided to specify usage.
      'cdif:identifier':
        '$ref': '../../schemaorgProperties/identifier/schema.yaml'
        description: >-
          Identifier for objects requiring short- or long-lasting referencing and management.
      'cdif:isDefinedBy_Variable':
        description: >-
          The variable this component is a role of -- a RepresentedVariable or an
          InstanceVariable, inline or by @id reference. See the note above $defs.
        anyOf:
        - '$ref': ../../cdifDataType/cdifRepresentedVariable/schema.yaml
        - '$ref': ../../cdifDataType/cdifInstanceVariable/schema.yaml
        - '$ref': '../objectReference/schema.yaml'
      'cdif:semantic':
        type: array
        items:
          $ref: '#/$defs/cdifConceptOrTermOrString'
        minItems: 1
        description: >-
          Qualifies the purpose or use expressed as a paired external controlled vocabulary.
    required:
    - '@type'
  AttributeComponent:
    type: object
    description: >-
      Role given to a represented variable in the context of a data structure to qualify observations
      or provide other types of supplementary information.
    properties:
      '@type':
        type: array
        items:
          type: string
        contains:
          const: 'cdi:AttributeComponent'
        minItems: 1
      '@id':
        type: string
        description: Identifier for this AttributeComponent node
      'cdif:qualifies':
        type: array
        items:
          anyOf:
          - '$ref': '#/$defs/DataStructureComponent'
          - '$ref': '../objectReference/schema.yaml'
        minItems: 1
      'cdif:identifier':
        '$ref': '../../schemaorgProperties/identifier/schema.yaml'
        description: >-
          Identifier for objects requiring short- or long-lasting referencing and management.
      'cdif:isDefinedBy_Variable':
        description: >-
          The variable this component is a role of -- a RepresentedVariable or an
          InstanceVariable, inline or by @id reference. See the note above $defs.
        anyOf:
        - '$ref': ../../cdifDataType/cdifRepresentedVariable/schema.yaml
        - '$ref': ../../cdifDataType/cdifInstanceVariable/schema.yaml
        - '$ref': '../objectReference/schema.yaml'
      'cdif:semantic':
        type: array
        items:
          $ref: '#/$defs/cdifConceptOrTermOrString'
        minItems: 1
        description: >-
          Qualifies the purpose or use expressed as a paired external controlled vocabulary.
    required:
    - '@type'
  DimensionComponent:
    type: object
    description: >-
      Role given to a represented variable in the context of a dimensional data structure
      to identify the universes associated with data points. The variable acts as a field
      in the compound identifier (the key structure) to disambiguate the cells in the multi-dimensional
      "cube".  AG: references to the variables which are the components of a compound identifier, in which each variable is a single field - an axis - in a coordinate system addressing a location in a matrix. These variables are often categorical, but also commonly include time. Unlike other Components, they may be ordered using instances of cdi:ComponentPosition.
    properties:
      '@type':
        type: array
        items:
          type: string
        contains:
          const: 'cdi:DimensionComponent'
        minItems: 1
      '@id':
        type: string
        description: Identifier for this DimensionComponent node
      'cdif:isDefinedBy_Variable':
        description: >-
          The variable this component is a role of -- a RepresentedVariable or an
          InstanceVariable, inline or by @id reference. See the note above $defs.
        anyOf:
        - '$ref': ../../cdifDataType/cdifRepresentedVariable/schema.yaml
        - '$ref': ../../cdifDataType/cdifInstanceVariable/schema.yaml
        - '$ref': '../objectReference/schema.yaml'

    required:
    - '@type'
    - 'cdif:isDefinedBy_Variable'
  VariableValueComponent:
    type: object
    description: >-
      Role given to a represented variable in the context of a data structure to record values
      of multiple variables.
    properties:
      '@type':
        type: array
        items:
          type: string
        contains:
          const: 'cdi:VariableValueComponent'
        minItems: 1
      '@id':
        type: string
        description: Identifier for this VariableValueComponent node
      'cdif:identifier':
        '$ref': '../../schemaorgProperties/identifier/schema.yaml'
        description: >-
          Identifier for objects requiring short- or long-lasting referencing and management.
      'cdif:isDefinedBy_Variable':
        description: >-
          The variable this component is a role of -- a RepresentedVariable or an
          InstanceVariable, inline or by @id reference. See the note above $defs.
        anyOf:
        - '$ref': ../../cdifDataType/cdifRepresentedVariable/schema.yaml
        - '$ref': ../../cdifDataType/cdifInstanceVariable/schema.yaml
        - '$ref': '../objectReference/schema.yaml'
      'cdif:semantic':
        type: array
        items:
          $ref: '#/$defs/cdifConceptOrTermOrString'
        minItems: 1
        description: >-
          Qualifies the purpose or use expressed as a paired external controlled vocabulary.
    required:
    - '@type'
  VariableDescriptorComponent:
    type: object
    description: >-
      Role given to a represented variable in the context of a data structure to provide codes
      for variable identification.
    properties:
      '@type':
        type: array
        items:
          type: string
        contains:
          const: 'cdi:VariableDescriptorComponent'
        minItems: 1
      '@id':
        type: string
        description: Identifier for this VariableDescriptorComponent node
      'cdif:isDefinedBy_DescriptorVariable':
        description: >-
          Variable that provides codes for variable identification in the context of
          a data structure. Descriptor Variables hold values which reference the
          logical variables in the data set, indicating which one the associated
          value in the corresponding Reference Variable is a measure/value for.
          Descriptor Variables are presentational variables found only in Long Data
          Sets.
        '$ref': ../../cdifDataType/cdifDescriptorVariable/schema.yaml
      'cdi:refersTo':
        '$ref': '../objectReference/schema.yaml'
      'cdif:identifier':
        '$ref': '../../schemaorgProperties/identifier/schema.yaml'
        description: >-
          Identifier for objects requiring short- or long-lasting referencing and management.
      'cdif:semantic':
        type: array
        items:
          $ref: '#/$defs/cdifConceptOrTermOrString'
        minItems: 1
        description: >-
          Qualifies the purpose or use expressed as a paired external controlled vocabulary.
    required:
    - '@type'
    - 'cdif:isDefinedBy_DescriptorVariable'
  DataStructureComponent:
    type: object
    description: Role given to a represented variable in the context of a data structure.
    properties:
      '@type':
        type: array
        items:
          type: string
        contains:
          const: 'cdi:DataStructureComponent'
        minItems: 1
      '@id':
        type: string
        description: Identifier for this DataStructureComponent node
      'cdif:identifier':
        '$ref': '../../schemaorgProperties/identifier/schema.yaml'
        description: >-
          Identifier for objects requiring short- or long-lasting referencing and management.
      'cdif:isDefinedBy_Variable':
        description: >-
          The variable this component is a role of -- a RepresentedVariable or an
          InstanceVariable, inline or by @id reference. See the note above $defs.
        anyOf:
        - '$ref': ../../cdifDataType/cdifRepresentedVariable/schema.yaml
        - '$ref': ../../cdifDataType/cdifInstanceVariable/schema.yaml
        - '$ref': '../objectReference/schema.yaml'
      'cdif:semantic':
        type: array
        items:
          $ref: '#/$defs/cdifConceptOrTermOrString'
        minItems: 1
        description: >-
          Qualifies the purpose or use expressed as a paired external controlled vocabulary.
    required:
    - '@type'
