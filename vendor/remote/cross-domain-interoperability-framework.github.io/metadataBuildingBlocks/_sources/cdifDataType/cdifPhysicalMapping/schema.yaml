---
$schema: https://json-schema.org/draft/2020-12/schema
title: Physical Mapping Type
description: Defines implementation-specific properties for the representation of a variable in a dataset.
  Aligned with CDIF 2026 schema using DDI-CDI flat per-column mapping structure.
type: object
properties:
  '@type':
    type: array
    items:
      type: string
    contains:
      enum:
        - 'cdif:PhysicalMapping'
        - 'cdif:TextMapping'
        - 'cdif:LocatorMapping'
    minItems: 1
    description: Must include a physical-mapping family type. A plain physical mapping
      uses cdif:PhysicalMapping; the cdifTextMapping / cdifLocatorMapping specializations
      narrow this to cdif:TextMapping / cdif:LocatorMapping respectively (they compose this
      schema via allOf, so the base accepts any of the family rather than requiring the
      cdif:PhysicalMapping token).
  cdif:index:
    type: integer
    minimum: 0
    description: Non-negative integer that orders the fields in the data structure (column number).
  cdif:format:
    type: string
    description: A format for number expressed as a string, or date format like YYYY/MM or MM-DD-YY.
  cdif:physicalDataType:
    $ref: '#/$defs/cdifConceptOrTermOrString'
    description: identifier or name for the data type concept.
  cdi:numberPattern:
    type: string
    description: Number format pattern for the field (PhysicalMapping.numberPattern). Text-format
      properties (column width, decimal/digit-group separators, display label) live on cdifTextMapping.
  cdi:nullSequence:
    type: string
    description: The value of this property becomes the null annotation for the described column.
  cdi:defaultValue:
    type: string
    description: A default string indicating the value to substitute for an empty string.
  cdi:scale:
    type: integer
  cdi:decimalPositions:
    type: integer
  cdi:minimumLength:
    type: integer
  cdi:maximumLength:
    type: integer
  cdi:isRequired:
    type: boolean
    default: false
  cdif:formats_InstanceVariable:
    description: "Reference to a variable defined in schema:variableMeasured."
    $ref: ../objectReference/schema.yaml
# Which property a mapping must carry follows from its @type, so the rule belongs
# here on the BASE rather than on the specializations.
#
# Consumers reference the family as `anyOf [cdifPhysicalMapping, cdifTextMapping,
# cdifLocatorMapping]` (cdifDataDescription cdif:hasPhysicalMapping), and this
# base deliberately accepts every token of the family in its @type. A `required`
# placed on a specialization is therefore satisfied by the base branch instead:
# measured 2026-09-26, a cdif:LocatorMapping node carrying NO cdi:locator
# validated against the profile, even though cdifLocatorMapping has required
# [cdi:locator]. The rule read as passing because it never fired. Putting the
# conditions on the base puts them in every branch, so there is nothing to fall
# through to.
#
# `required: ['@type']` inside each `if` is load-bearing. Without it a node with
# no @type satisfies the guard vacuously -- `properties` only applies to keys
# that are present -- so `then` would fire for every mapping and make both
# properties unconditionally mandatory.
allOf:
- if:
    required: ['@type']
    properties:
      '@type':
        contains:
          const: 'cdif:TextMapping'
  then:
    required: ['cdif:index']
- if:
    required: ['@type']
    properties:
      '@type':
        contains:
          const: 'cdif:LocatorMapping'
  then:
    required: ['cdi:locator']
$defs:
  cdifConceptOrTermOrString:
    $ref: ../cdifConceptOrTermOrString/schema.yaml
  cdifConceptOrTerm:
    $ref: ../cdifConceptOrTerm/schema.yaml